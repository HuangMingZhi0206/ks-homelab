# TLS hardening — modern-ish defaults, TLS 1.2 minimum.
tls:
  stores:
    default:
      # Served only when no other certificate matches the requested SNI: while
      # Let's Encrypt is still issuing, and if issuance ever fails.
      #
      # It must NOT also appear under `tls.certificates`. Traefik skips ACME for
      # any domain it already holds a matching certificate for, and this
      # wildcard matches every service hostname — listing it there silently
      # prevented a single certificate from ever being requested.
      defaultCertificate:
        certFile: /etc/traefik/certs/local.crt
        keyFile: /etc/traefik/certs/local.key

  options:
    default:
      minVersion: VersionTLS12
      # sniStrict rejects any SNI matching no *configured* certificate — it does
      # not fall back to defaultCertificate. With ACME as the only source of
      # matching certificates, turning it on would make every request fail
      # outright during issuance, or permanently if issuance broke. Off, the
      # fallback covers those gaps and the failure mode is a browser warning
      # instead of a dead site.
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
