# Minimal SNMP module, hand-written rather than generated.
#
# The stock `if_mib` module walks the whole interface table — 22 columns — and
# cheap switches stop answering partway through. A DGS-1100 replies instantly to
# a single column but times out on the full subtree, and the exporter reports
# that only as a scrape timeout.
#
# So walk four columns instead of twenty-two: enough for per-port throughput and
# link state, which is all a switch is really worth monitoring for.
#
# max_repetitions is well below the default 25 for the same reason — small
# agents choke on large GETBULK responses.

auths:
  public_v2:
    community: public
    version: 2

modules:
  switch_basic:
    max_repetitions: 5
    retries: 3
    timeout: 5s
    walk:
      - 1.3.6.1.2.1.2.2.1.2     # ifDescr
      - 1.3.6.1.2.1.2.2.1.8     # ifOperStatus
      - 1.3.6.1.2.1.2.2.1.10    # ifInOctets
      - 1.3.6.1.2.1.2.2.1.16    # ifOutOctets
    metrics:
      - name: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
        help: The textual name of the interface - 1.3.6.1.2.1.2.2.1.2
        indexes:
          - labelname: ifIndex
            type: gauge

      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: The current operational state of the interface - 1.3.6.1.2.1.2.2.1.8
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

      - name: ifInOctets
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: Octets received on the interface - 1.3.6.1.2.1.2.2.1.10
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

      - name: ifOutOctets
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: Octets transmitted on the interface - 1.3.6.1.2.1.2.2.1.16
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
