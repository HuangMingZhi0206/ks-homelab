# Authelia configuration (v4.39).
# {{ env "DOMAIN" }} is expanded at startup because the container sets
# X_AUTHELIA_CONFIG_FILTERS=template. Secrets are injected via *_FILE env vars
# in docker-compose.yml — do not put secret values in this file.

theme: 'dark'

server:
  address: 'tcp://:9091'

log:
  level: 'info'
  format: 'json'

telemetry:
  metrics:
    enabled: true
    address: 'tcp://:9959'

totp:
  issuer: '{{ env "DOMAIN" }}'

authentication_backend:
  file:
    path: '/config/users_database.yml'
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'deny'
  rules:
    # The auth portal itself must be reachable without auth.
    - domain: 'auth.{{ env "DOMAIN" }}'
      policy: 'bypass'
    # The wall-display kiosk: one host, Grafana only, read-only. Grafana's
    # anonymous Viewer role does the actual limiting — this rule only spares
    # that one machine the login prompt so the screen never goes stale.
    # KIOSK_IP defaults to 127.0.0.1/32, which matches nothing in practice.
    - domain: 'grafana.{{ env "DOMAIN" }}'
      networks:
        - '{{ env "KIOSK_IP" }}'
      policy: 'bypass'
    # Everything else on the domain requires login.
    # Change to 'two_factor' once you have enrolled a TOTP device.
    - domain: '*.{{ env "DOMAIN" }}'
      policy: 'one_factor'

session:
  name: 'authelia_session'
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://grafana.{{ env "DOMAIN" }}'
      expiration: '12h'
      inactivity: '45m'
      remember_me: '1M'
  redis:
    host: 'redis'
    port: 6379

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '10m'

storage:
  local:
    path: '/data/db.sqlite3'

# Filesystem notifier: password-reset links are written to this file instead
# of being emailed. Swap for the smtp notifier when you have a mail relay.
notifier:
  filesystem:
    filename: '/data/notification.txt'
