name: homelab

# ------------------------------------------------------------------------------
# Networks
#   proxy      — everything Traefik routes to lives here
#   monitoring — internal-only; Prometheus scrapes targets here
#   authelia   — internal-only; Authelia <-> Redis
# ------------------------------------------------------------------------------
networks:
  proxy:
    name: proxy
  monitoring:
    internal: true

  # Exporters that scrape devices outside Docker — a hypervisor, a switch — need
  # a route off the host, which `monitoring` deliberately does not have. They sit
  # on both: this one to reach the device, `monitoring` to be scraped.
  egress:

  authelia:
    internal: true

  # Internal-only: Nextcloud <-> its own Postgres and Redis.
  nextcloud:
    internal: true

  # Voice pipeline talking to itself. NOT internal: Whisper, Piper and Ollama
  # each download their model on first run, and `internal: true` blocks the
  # route out. Nothing here publishes a port or gets a Traefik route, which is
  # what actually keeps it unreachable from the LAN.
  voice:

# ------------------------------------------------------------------------------
# Secrets — generated by scripts/bootstrap.sh, never committed
# ------------------------------------------------------------------------------
secrets:
  authelia_jwt_secret:
    file: ./secrets/authelia_jwt_secret
  authelia_session_secret:
    file: ./secrets/authelia_session_secret
  authelia_storage_encryption_key:
    file: ./secrets/authelia_storage_encryption_key
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  nextcloud_db_password:
    file: ./secrets/nextcloud_db_password
  nextcloud_admin_password:
    file: ./secrets/nextcloud_admin_password

volumes:
  authelia_data:
  redis_data:
  prometheus_data:
  grafana_data:
  portainer_data:
  adguard_work:
  adguard_conf:
  ntfy_cache:
  ntfy_data:
  filebrowser_data:
  filebrowser_quantum_data:
  nextcloud_html:
  nextcloud_data:
  nextcloud_db:
  nextcloud_redis:
  whisper_data:
  piper_data:
  ollama_models:

services:
  # ==============================================================================
  # Traefik — reverse proxy, TLS termination, Let's Encrypt
  # ==============================================================================
  traefik:
    image: traefik:v3.6.25
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    networks:
      - proxy
      - monitoring
    environment:
      - TZ=${TZ}
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL:-INFO}
      # Cloudflare API token for the DNS-01 challenge. Scope it to Zone -> DNS
      # -> Edit on this zone only; a Global API Key would let Traefik touch
      # every domain in the account.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme:/acme
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      # Dashboard at https://traefik.${DOMAIN}, protected by Authelia
      traefik.http.routers.traefik.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.tls.certresolver: letsencrypt
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.middlewares: authelia@file

  # ==============================================================================
  # Authelia — SSO / forward-auth provider (+ Redis session store)
  # ==============================================================================
  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - authelia
      - monitoring
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - authelia_jwt_secret
      - authelia_session_secret
      - authelia_storage_encryption_key
    environment:
      - TZ=${TZ}
      - DOMAIN=${DOMAIN}
      # Enables {{ env "DOMAIN" }} templating inside configuration.yml
      # Host allowed to reach Grafana without authenticating (the kiosk display).
      # Defaults to loopback, i.e. nothing, when KIOSK_IP is unset.
      - KIOSK_IP=${KIOSK_IP:-127.0.0.1/32}
      - X_AUTHELIA_CONFIG_FILTERS=template
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/run/secrets/authelia_jwt_secret
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia_session_secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/run/secrets/authelia_storage_encryption_key
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml
      - authelia_data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.authelia.rule: Host(`auth.${DOMAIN}`)
      traefik.http.routers.authelia.entrypoints: websecure
      traefik.http.routers.authelia.tls.certresolver: letsencrypt
      traefik.http.services.authelia.loadbalancer.server.port: "9091"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - authelia
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # Monitoring — Prometheus, Grafana, node-exporter, cAdvisor
  # ==============================================================================
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.external-url=https://prometheus.${DOMAIN}'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    labels:
      traefik.enable: "true"
      traefik.http.routers.prometheus.rule: Host(`prometheus.${DOMAIN}`)
      traefik.http.routers.prometheus.entrypoints: websecure
      traefik.http.routers.prometheus.tls.certresolver: letsencrypt
      traefik.http.routers.prometheus.middlewares: authelia@file
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - monitoring
    depends_on:
      - prometheus
    secrets:
      - grafana_admin_password
    environment:
      - TZ=${TZ}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Read-only access without a Grafana login, for the wall-display kiosk.
      # Only reachable by hosts Authelia bypasses (see KIOSK_IP); everyone else
      # still hits the SSO portal first, and editing still requires logging in.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.tls.certresolver: letsencrypt
      traefik.http.routers.grafana.middlewares: authelia@file
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - monitoring
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  # ==============================================================================
  # Optional services — enabled via Compose profiles.
  # Set COMPOSE_PROFILES in .env (e.g. COMPOSE_PROFILES=portainer,homepage)
  # or run: docker compose --profile portainer up -d
  # ==============================================================================

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    profiles:
      - portainer
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: Host(`portainer.${DOMAIN}`)
      traefik.http.routers.portainer.entrypoints: websecure
      traefik.http.routers.portainer.tls.certresolver: letsencrypt
      traefik.http.routers.portainer.middlewares: authelia@file
      traefik.http.services.portainer.loadbalancer.server.port: "9000"

  # AdGuard Home — DNS ports are published directly on the host; the web UI
  # goes through Traefik. IMPORTANT: during the first-run wizard, set the
  # admin web interface port to 3000 so the Traefik route below keeps working.
  # If the host runs systemd-resolved, free port 53 first (see README).
  adguard:
    image: adguard/adguardhome:latest  # pin a specific version for production
    container_name: adguard
    restart: unless-stopped
    profiles:
      - adguard
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    labels:
      traefik.enable: "true"
      traefik.http.routers.adguard.rule: Host(`adguard.${DOMAIN}`)
      traefik.http.routers.adguard.entrypoints: websecure
      traefik.http.routers.adguard.tls.certresolver: letsencrypt
      traefik.http.routers.adguard.middlewares: authelia@file
      traefik.http.services.adguard.loadbalancer.server.port: "3000"

  # Ntfy — deliberately NOT behind Authelia: mobile apps subscribe directly
  # and can't follow the SSO redirect. Ntfy's own auth is set to deny-all;
  # create users with: docker compose exec ntfy ntfy user add --role=admin <name>
  ntfy:
    image: binwiederhier/ntfy:v2.11.0  # check for newer releases
    container_name: ntfy
    restart: unless-stopped
    profiles:
      - ntfy
    command: serve
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=https://ntfy.${DOMAIN}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      # A body larger than this is treated as an attachment, and attachments are
      # off — so an oversized publish fails as "attachments not allowed" rather
      # than anything mentioning size. Grafana webhook payloads carry the full
      # alert JSON and blow past the 4K default, so raise it.
      - NTFY_MESSAGE_SIZE_LIMIT=16384
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    labels:
      traefik.enable: "true"
      traefik.http.routers.ntfy.rule: Host(`ntfy.${DOMAIN}`)
      traefik.http.routers.ntfy.entrypoints: websecure
      traefik.http.routers.ntfy.tls.certresolver: letsencrypt
      traefik.http.services.ntfy.loadbalancer.server.port: "80"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest  # pin a specific version for production
    container_name: homepage
    restart: unless-stopped
    profiles:
      - homepage
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=home.${DOMAIN}
      - HOMEPAGE_VAR_DOMAIN=${DOMAIN}
    volumes:
      - ./homepage/config:/app/config
      # Read-only socket for the docker status widget
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.homepage.rule: Host(`home.${DOMAIN}`)
      traefik.http.routers.homepage.entrypoints: websecure
      traefik.http.routers.homepage.tls.certresolver: letsencrypt
      traefik.http.routers.homepage.middlewares: authelia@file
      traefik.http.services.homepage.loadbalancer.server.port: "3000"

  # ==============================================================================
  # Optional exporters — monitor machines outside this host
  # ==============================================================================

  # Proxmox VE: node CPU/RAM/storage plus per-VM and per-LXC state.
  # Needs an API token on the Proxmox side; PVEAuditor is enough (read-only).
  # See docs/monitoring-targets.md.
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.10.0
    container_name: pve-exporter
    restart: unless-stopped
    profiles:
      - pve-exporter
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring
      - egress
    environment:
      - TZ=${TZ}
      - PVE_USER=${PVE_USER:-prometheus@pve}
      - PVE_TOKEN_NAME=${PVE_TOKEN_NAME:-}
      - PVE_TOKEN_VALUE=${PVE_TOKEN_VALUE:-}
      # Proxmox ships a self-signed certificate by default.
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-false}

  # Managed switches expose traffic and link state over SNMP but have no REST
  # API, so this is the only way to graph per-port throughput. Uses the bundled
  # if_mib module, which covers interface counters on essentially any switch.
  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1
    container_name: snmp-exporter
    restart: unless-stopped
    profiles:
      - snmp-exporter
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring
      - egress
    volumes:
      # A trimmed copy of the bundled config. Switches that do not implement
      # ifXTable simply stop answering rather than saying so, and the exporter
      # then burns its whole scrape budget on retries — so the 64-bit counter
      # OID is removed from the walk list. See docs/monitoring-targets.md.
      - ./monitoring/snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    environment:
      - TZ=${TZ}

  # ==============================================================================
  # File Browser Quantum — web UI for the USB disk mounted on the host
  # ==============================================================================
  # A fork of Filebrowser, swapped in for the nicer UI: thumbnails for video and
  # office files, indexed search, and proxy auth so Authelia stays the only
  # login. It also removes Filebrowser's shell-command feature outright, which
  # had turned any auth slip into code execution on this host.
  #
  # Config lives in ./filebrowser/config.yaml — the source path and the proxy
  # header are set there, not through env vars.
  #
  # No `ports:` entry, ever. Proxy auth means this app trusts the Remote-User
  # header blindly, so Traefik must be the only thing that can reach it.
  #
  # Deliberately has no public DNS record, exactly like the rest of lab.<domain>.
  # From outside the house you reach it over Tailscale, not over the internet —
  # this share holds every family photo, and a browser-facing file manager is a
  # much larger target than a dashboard. See docs/storage.md.
  filebrowser:
    image: gtstef/filebrowser:1.5.6-stable
    container_name: filebrowser
    restart: unless-stopped
    profiles:
      - filebrowser
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      # The host mount point of the disk. ntfs3 maps every file to uid/gid 1000
      # regardless of what the container runs as, so there is nothing to align.
      - ${STORAGE_PATH:-/srv/hdd}:/folder
      # Its own sqlite database and thumbnail cache. A NEW volume, not the old
      # filebrowser_data: that one still holds the previous app's BoltDB, so
      # rolling back means restoring the old service block and nothing else.
      - filebrowser_quantum_data:/home/filebrowser/data
      - ./filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro
    environment:
      - TZ=${TZ}
    labels:
      traefik.enable: "true"
      traefik.http.routers.filebrowser.rule: Host(`files.${DOMAIN}`)
      traefik.http.routers.filebrowser.entrypoints: websecure
      traefik.http.routers.filebrowser.tls.certresolver: letsencrypt
      traefik.http.routers.filebrowser.middlewares: authelia@file
      traefik.http.services.filebrowser.loadbalancer.server.port: "80"

  # ==============================================================================
  # Nextcloud — file sync, with the USB disk attached as external storage
  # ==============================================================================
  # Deliberately NOT behind authelia@file. The desktop sync client and the phone
  # app speak WebDAV, not a browser session, so they cannot follow an SSO
  # redirect — the same reason ntfy sits outside it. Nextcloud's own login is
  # what guards this; turn on 2FA in its admin settings.
  #
  # Its own data directory lives on a named volume (the NVMe), NOT on the NTFS
  # disk: Nextcloud chowns and locks files there, which ntfs3 cannot express.
  # The USB disk is attached afterwards as External Storage instead — see
  # docs/storage.md for the mount options and the scan job that makes files
  # dropped over Samba show up.
  nextcloud:
    image: nextcloud:31-apache   # check for a newer major before bumping
    container_name: nextcloud
    restart: unless-stopped
    profiles:
      - nextcloud
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - nextcloud
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    secrets:
      - nextcloud_db_password
      - nextcloud_admin_password
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD_FILE=/run/secrets/nextcloud_db_password
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD_FILE=/run/secrets/nextcloud_admin_password
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${DOMAIN}
      # Keep the data directory off /var/www/html so an image upgrade never
      # walks over it.
      - NEXTCLOUD_DATA_DIR=/var/www/data
      # Traefik terminates TLS, so Nextcloud sees plain HTTP and would generate
      # http:// links without these.
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://cloud.${DOMAIN}
      # Docker's default bridge range — lets Nextcloud trust the X-Forwarded-For
      # Traefik sets, so rate limiting sees real client addresses.
      - TRUSTED_PROXIES=172.16.0.0/12
      - PHP_UPLOAD_LIMIT=10G
      - PHP_MEMORY_LIMIT=768M
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/data
      # The USB disk. Add it in the web UI under Administration -> External
      # storage as Local, with this path. Not mounted read-only: the point is
      # to manage the shared files, not just look at them.
      - ${STORAGE_PATH:-/srv/hdd}:/mnt/hdd
    labels:
      traefik.enable: "true"
      traefik.http.routers.nextcloud.rule: Host(`cloud.${DOMAIN}`)
      traefik.http.routers.nextcloud.entrypoints: websecure
      traefik.http.routers.nextcloud.tls.certresolver: letsencrypt
      traefik.http.routers.nextcloud.middlewares: nextcloud-dav
      traefik.http.services.nextcloud.loadbalancer.server.port: "80"
      # Calendar and contact clients probe /.well-known/{card,cal}dav. Without
      # this redirect Nextcloud reports a setup warning and CalDAV autodiscovery
      # silently fails.
      traefik.http.middlewares.nextcloud-dav.redirectregex.regex: '^https://([^/]+)/\.well-known/(card|cal)dav'
      traefik.http.middlewares.nextcloud-dav.redirectregex.replacement: 'https://$${1}/remote.php/dav'
      traefik.http.middlewares.nextcloud-dav.redirectregex.permanent: "true"

  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    profiles:
      - nextcloud
    security_opt:
      - no-new-privileges:true
    networks:
      - nextcloud
    secrets:
      - nextcloud_db_password
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD_FILE=/run/secrets/nextcloud_db_password
    volumes:
      - nextcloud_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Separate from the Redis that holds Authelia sessions on purpose: a cache
  # flush here must never be able to log everyone out of the homelab.
  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    profiles:
      - nextcloud
    security_opt:
      - no-new-privileges:true
    networks:
      - nextcloud
    volumes:
      - nextcloud_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # Voice assistant — Home Assistant + Whisper (STT) + Piper (TTS) + Ollama (LLM)
  # ==============================================================================
  # Bilingual ID/EN daily assistant: the time, CPU temperature, free space,
  # system state. See docs/voice-assistant.md.
  #
  # CPU is the scarce resource here, not RAM. This Pi also answers every DNS
  # query in the house and runs Authelia and Prometheus, and inference happily
  # saturates all four cores. So Whisper, Piper and Ollama are pinned to cores
  # 2-3, leaving 0-1 for the homelab stack. They can share those two cores
  # because the pipeline is strictly sequential — speech to text, then the
  # model, then text to speech; two of them are never busy at once.
  #
  # Home Assistant itself is not pinned: it is latency-sensitive but cheap.

  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    profiles:
      - voice
    networks:
      # `proxy` for Traefik, and it doubles as the route to Prometheus, which
      # the REST sensors in homeassistant/config/configuration.yaml query.
      - proxy
      - voice
    environment:
      - TZ=${TZ}
    volumes:
      - ./homeassistant/config:/config
      # Lets Home Assistant show the correct local time without a restart when
      # the host's timezone data changes.
      - /etc/localtime:/etc/localtime:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.homeassistant.rule: Host(`ha.${DOMAIN}`)
      traefik.http.routers.homeassistant.entrypoints: websecure
      traefik.http.routers.homeassistant.tls.certresolver: letsencrypt
      # Deliberately NO authelia@file. The Companion app on a phone talks to
      # the API directly and cannot follow an SSO redirect — the same reason
      # ntfy sits outside it. Home Assistant has its own login; turn on its 2FA.
      traefik.http.services.homeassistant.loadbalancer.server.port: "8123"

  # Speech to text. `--language auto` is what makes bilingual work: the model
  # detects Indonesian or English per utterance instead of being locked to one.
  # `base` rather than `tiny` because tiny's Indonesian accuracy is poor.
  wyoming-whisper:
    image: rhasspy/wyoming-whisper:3.7.0
    container_name: wyoming-whisper
    restart: unless-stopped
    profiles:
      - voice
    security_opt:
      - no-new-privileges:true
    networks:
      - voice
    command: --model base --language auto --beam-size 1
    cpuset: "2,3"
    mem_limit: 2g
    volumes:
      - whisper_data:/data

  # Text to speech. id_ID-news_tts-medium is the only Indonesian voice Piper
  # ships; for English answers add a second Piper instance or switch the voice
  # in the Home Assistant pipeline.
  wyoming-piper:
    image: rhasspy/wyoming-piper:2.4.3
    container_name: wyoming-piper
    restart: unless-stopped
    profiles:
      - voice
    security_opt:
      - no-new-privileges:true
    networks:
      - voice
    command: --voice id_ID-news_tts-medium
    cpuset: "2,3"
    mem_limit: 1g
    volumes:
      - piper_data:/data

  # The model. qwen2.5:1.5b is ~1GB on disk and chosen for Indonesian fluency
  # at a size that answers quickly on CPU. Pull it once after first start:
  #   docker compose exec ollama ollama pull qwen2.5:1.5b
  ollama:
    image: ollama/ollama:0.33.3
    container_name: ollama
    restart: unless-stopped
    profiles:
      - voice
    networks:
      - voice
    cpuset: "2,3"
    mem_limit: 3g
    environment:
      - TZ=${TZ}
      # Keep the model resident instead of unloading after five minutes.
      # Without this, the first question after a quiet spell pays a cold load
      # of ~1GB off the NVMe before it answers — which is exactly the pause
      # a daily assistant must not have. Costs ~1.5GB held permanently.
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=1
      # Single user; more parallelism only multiplies the context memory.
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_models:/root/.ollama
