# {{HOMEPAGE_VAR_DOMAIN}} is injected from the DOMAIN env var (see docker-compose.yml)
#
# Entries that point at a bare IP are appliances that live outside this stack
# and outside lab.<domain>: they have their own TLS (self-signed) and their own
# login. Homepage only links to them.
#
# Only list what is actually running. A tile that leads nowhere teaches you to
# distrust the whole page — the commented blocks below are services whose
# Compose profile is currently off, ready to uncomment when it is turned on.

- Infrastructure:
    - Proxmox:
        icon: proxmox.svg
        href: https://192.168.200.10:8006
        description: Hypervisor — VMs & LXC
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PVE_URL}}"
          username: "{{HOMEPAGE_VAR_PVE_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PVE_TOKEN}}"
          node: "{{HOMEPAGE_VAR_PVE_NODE}}"
    - OPNsense:
        icon: opnsense.svg
        href: https://192.168.10.1
        description: Router, DHCP, DNS, firewall
    - TP-Link MR100:
        icon: tp-link.svg
        href: http://192.168.100.1
        description: LTE modem — signal, SIM, reboot
    - Traefik:
        icon: traefik.svg
        href: https://traefik.{{HOMEPAGE_VAR_DOMAIN}}
        description: Reverse proxy & TLS
    # Profile `portainer` is off. OPNsense already serves DNS for the house,
    # so `adguard` is off too.
    #- Portainer:
    #    icon: portainer.svg
    #    href: https://portainer.{{HOMEPAGE_VAR_DOMAIN}}
    #    description: Container management
    #- AdGuard Home:
    #    icon: adguard-home.svg
    #    href: https://adguard.{{HOMEPAGE_VAR_DOMAIN}}
    #    description: DNS & ad blocking

- Monitoring:
    - Grafana:
        icon: grafana.svg
        href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}
        description: Dashboards
    - Prometheus:
        icon: prometheus.svg
        href: https://prometheus.{{HOMEPAGE_VAR_DOMAIN}}
        description: Metrics

- Storage:
    - File Browser:
        icon: filebrowser.svg
        href: https://files.{{HOMEPAGE_VAR_DOMAIN}}
        description: USB disk on the Pi
    # Profile `nextcloud` is off — it needs the mount permission change in
    # docs/storage.md before it can write to the disk.
    #- Nextcloud:
    #    icon: nextcloud.svg
    #    href: https://cloud.{{HOMEPAGE_VAR_DOMAIN}}
    #    description: Files, calendar, contacts

- Apps:
    - Coolify:
        icon: coolify.svg
        href: https://coolify.syonin.site
        description: Deploys the public sites
    # Running on this Pi, not the Pi 4. The Companion app is the better way in
    # — notifications, phone sensors, presence — so treat this as a shortcut.
    - Home Assistant:
        icon: home-assistant.svg
        href: https://ha.{{HOMEPAGE_VAR_DOMAIN}}
        description: Home automation & voice

- Auth:
    - Authelia:
        icon: authelia.svg
        href: https://auth.{{HOMEPAGE_VAR_DOMAIN}}
        description: SSO portal
