# TLS hardening — modern-ish defaults, TLS 1.2 minimum.
#
# Deliberately no `certificates` and no `stores.default.defaultCertificate`.
# Traefik counts any certificate in the store as coverage for a domain, so a
# self-signed wildcard for *.${DOMAIN} makes ACME conclude there is nothing to
# issue — it logs "No ACME certificate generation required for domains" and
# quietly serves the self-signed one forever. That is a silent failure: every
# service works, just with a browser warning and no error anywhere to explain
# it. Leave certificate provisioning entirely to the ACME resolver.
#
# Traefik still has a built-in default certificate for unmatched SNI, which
# covers the minute or two before the first certificate is issued.
tls:
  options:
    default:
      minVersion: VersionTLS12
      # Must stay false. sniStrict rejects any SNI matching no *configured*
      # certificate and ignores the built-in default, so with ACME as the only
      # source of certificates it would reject every request until issuance
      # completes — and permanently if issuance ever broke.
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
