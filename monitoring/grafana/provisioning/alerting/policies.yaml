apiVersion: 1

policies:
  - orgId: 1
    receiver: homelab
    # Collapse a burst into one message: when the Pi reboots, every target
    # goes down at once and that is one event, not eight.
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    # How often an alert that is still firing repeats. Four hours is the
    # compromise between forgetting and nagging; anything shorter trains you
    # to ignore it.
    repeat_interval: 4h
