global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: traefik
    static_configs:
      - targets: ['traefik:8082']

  - job_name: authelia
    static_configs:
      - targets: ['authelia:9959']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  # ---------------------------------------------------------------- external
  # These two scrape machines outside this host, through an exporter that
  # translates their protocol. Each needs its Compose profile enabled
  # (pve-exporter / snmp-exporter) — otherwise the job simply shows as down.
  #
  # The targets below are addresses on your network: change them.
  # The relabel block is the standard exporter pattern — the address being
  # monitored travels as the `target` parameter, while the request itself goes
  # to the exporter.

  - job_name: proxmox
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets: ['192.168.200.10']   # Proxmox host
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: switch
    # An SNMP walk of if_mib across every port is slow on a small switch — well
    # past the 10s default, which surfaces only as "context deadline exceeded".
    # Polling interface counters every 15s is pointless anyway.
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      auth: [public_v2]     # community string; change if yours is not "public"
      module: [switch_basic]
    static_configs:
      - targets: ['192.168.200.2']    # managed switch
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # Certificate expiry for the internal hostnames. Same relabel dance as the
  # switch job: the target travels as a URL parameter, and __address__ is
  # rewritten to the exporter that performs the probe.
  #
  # Certificates are renewed a month ahead and change rarely, so probing every
  # fifteen seconds would only add load to a Pi that cannot spare it.
  - job_name: tls
    scrape_interval: 5m
    scrape_timeout: 30s
    metrics_path: /probe
    params:
      module: [tls_connect]
    static_configs:
      - targets:
          - auth.lab.syonin.site:443
          - grafana.lab.syonin.site:443
          - files.lab.syonin.site:443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
