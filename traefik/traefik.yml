# Traefik v3 static configuration.
# Changes here require a container restart. Runtime routing config lives in
# ./dynamic (hot-reloaded) and in docker-compose.yml labels.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"

api:
  dashboard: true

ping:
  entryPoint: metrics

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      middlewares:
        - security-headers@file
      # Certificates come from Let's Encrypt via DNS-01. Traefik requests one
      # per router hostname on demand — no `domains:` block is needed, which
      # matters because this file is static config and cannot read ${DOMAIN}.
      #
      # Until a certificate is issued (or if ACME fails), the self-signed
      # wildcard in dynamic/tls.yml is served instead, so `sniStrict` never
      # rejects a request outright.
      tls:
        certResolver: letsencrypt

  # Internal-only entrypoint: Prometheus scrapes /metrics here, healthcheck
  # pings /ping here. Not published to the host.
  metrics:
    address: ":8082"

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addServicesLabels: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "changeme@example.com"  # overwritten by bootstrap.sh from ACME_EMAIL
      storage: /acme/acme.json
      # Uncomment while testing to avoid Let's Encrypt rate limits
      # (certificates will be untrusted but issuance always succeeds):
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      #
      # DNS-01, not HTTP-01: this stack sits behind double NAT (LTE router ->
      # OPNsense) and has no inbound reachability, so a challenge that requires
      # Let's Encrypt to reach port 80 can never succeed. DNS-01 only needs API
      # access to the zone — see CF_DNS_API_TOKEN in .env.
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true
