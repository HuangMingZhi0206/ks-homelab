# TLS hardening — modern-ish defaults, TLS 1.2 minimum.
tls:
  # In local mode there is no ACME resolver issuing per-host certificates, so
  # the only certificate Traefik has is the self-signed wildcard that
  # bootstrap.sh generates for the configured domain. It is registered both as
  # a matchable certificate and as the default, because `sniStrict` below
  # rejects any SNI that matches no configured certificate — without this,
  # every request fails with a TLS `unrecognized_name` alert.
  #
  # Switching to real certificates (DNS-01, see traefik.yml) makes this block
  # redundant but harmless: ACME certificates take precedence when they match.
  certificates:
    - certFile: /etc/traefik/certs/local.crt
      keyFile: /etc/traefik/certs/local.key

  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/local.crt
        keyFile: /etc/traefik/certs/local.key

  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
