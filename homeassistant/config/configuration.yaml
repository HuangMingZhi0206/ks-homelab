# Home Assistant — configuration for the container install (not HAOS).

default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# REQUIRED behind Traefik. Without this, Home Assistant sees the
# X-Forwarded-For header Traefik adds, decides it came from an untrusted
# proxy, and answers every request with "400: Bad Request" — including the
# onboarding screen, so you can never log in to fix it from the UI.
# 172.16.0.0/12 is Docker's default bridge range.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12

# ---------------------------------------------------------------------------
# System sensors, read from Prometheus.
#
# The obvious approach — Home Assistant's System Monitor integration — does
# not work here: a container sees its own /proc and cgroup, not the host's, so
# it would report the container's view rather than the Pi's. Prometheus already
# scrapes node-exporter on this host, so ask it instead. Home Assistant and
# Prometheus both sit on the `proxy` network, which is why this name resolves.
#
# These use the `rest:` integration rather than `sensor: - platform: rest`,
# specifically for `availability`. A Prometheus query that matches nothing
# returns an empty result list, and without `availability` the value_template
# has to render *something* — an empty string — which Home Assistant then
# rejects outright:
#
#   Sensor ... has state class 'measurement' ... however, it has the
#   non-numeric value: '' -- Error adding entity
#
# That kills the entity at startup, and it stays dead until the next restart.
# `availability` is the supported way to say "no reading right now": the entity
# goes `unavailable` and the value_template is not asked for a number.
#
# This matters here in normal operation, not just in theory: HDD Free has no
# data whenever the USB disk is unplugged, and every sensor returns nothing for
# the few seconds after a restart before Prometheus is reachable.
#
# VERIFY THE METRIC NAMES against your own Prometheus before trusting these.
# Open https://prometheus.<domain> and run the query by hand.
# ---------------------------------------------------------------------------
rest:
  - resource: http://prometheus:9090/api/v1/query
    params:
      query: 'node_thermal_zone_temp{type="cpu-thermal"}'
    scan_interval: 60
    sensor:
      - name: Pi CPU Temperature
        unique_id: pi_cpu_temperature
        availability: "{{ value_json.data.result | count > 0 }}"
        value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

  - resource: http://prometheus:9090/api/v1/query
    params:
      query: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100'
    scan_interval: 60
    sensor:
      - name: Pi Memory Used
        unique_id: pi_memory_used
        availability: "{{ value_json.data.result | count > 0 }}"
        value_template: "{{ value_json.data.result[0].value[1] | float | round(0) }}"
        unit_of_measurement: "%"
        state_class: measurement

  - resource: http://prometheus:9090/api/v1/query
    params:
      query: 'node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}'
    scan_interval: 300
    sensor:
      - name: Pi NVMe Free
        unique_id: pi_nvme_free
        availability: "{{ value_json.data.result | count > 0 }}"
        value_template: "{{ (value_json.data.result[0].value[1] | float / 1024**3) | round(1) }}"
        unit_of_measurement: "GB"
        device_class: data_size
        state_class: measurement

  # Goes unavailable whenever the USB disk is unplugged. That is correct, and
  # it is the case that exposed the bug above.
  - resource: http://prometheus:9090/api/v1/query
    params:
      query: 'node_filesystem_avail_bytes{mountpoint="/srv/hdd"}'
    scan_interval: 300
    sensor:
      - name: HDD Free
        unique_id: hdd_free
        availability: "{{ value_json.data.result | count > 0 }}"
        value_template: "{{ (value_json.data.result[0].value[1] | float / 1024**3) | round(1) }}"
        unit_of_measurement: "GB"
        device_class: data_size
        state_class: measurement

  - resource: http://prometheus:9090/api/v1/query
    params:
      query: 'node_load1'
    scan_interval: 60
    sensor:
      - name: Pi Load
        unique_id: pi_load
        availability: "{{ value_json.data.result | count > 0 }}"
        value_template: "{{ value_json.data.result[0].value[1] | float | round(2) }}"
        state_class: measurement

  # --- Room panel (roomhub/ in this repo) ----------------------------------
  # The Arduino has no network. The Pi publishes its readings as Prometheus
  # metrics and we read them back here, the same way as everything above.
  # Goes unavailable when the DHT11 fails, which it occasionally does.
  - resource: http://prometheus:9090/api/v1/query
    params:
      query: 'roomhub_room_temperature_celsius'
    scan_interval: 60
    sensor:
      - name: Suhu Kamar
        unique_id: suhu_kamar
        availability: "{{ value_json.data.result | count > 0 }}"
        value_template: "{{ value_json.data.result[0].value[1] | float | round(1) }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

  - resource: http://prometheus:9090/api/v1/query
    params:
      query: 'roomhub_room_humidity_percent'
    scan_interval: 60
    sensor:
      - name: Kelembapan Kamar
        unique_id: kelembapan_kamar
        availability: "{{ value_json.data.result | count > 0 }}"
        value_template: "{{ value_json.data.result[0].value[1] | float | round(0) }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement

  # These two back the switch and the number below. They are what the Arduino
  # BELIEVES about the AC, not what the AC is doing — IR is one way and the
  # unit cannot answer. Use the original remote and these go stale until the
  # next command from here. 30 seconds rather than 60 so the toggle in the app
  # settles back quickly after you press it.
  - resource: http://prometheus:9090/api/v1/query
    params:
      query: 'roomhub_ac_power'
    scan_interval: 30
    sensor:
      - name: AC Kamar Power
        unique_id: ac_kamar_power
        availability: "{{ value_json.data.result | count > 0 }}"
        value_template: "{{ value_json.data.result[0].value[1] | int }}"

  - resource: http://prometheus:9090/api/v1/query
    params:
      query: 'roomhub_ac_target_celsius'
    scan_interval: 30
    sensor:
      - name: AC Kamar Setpoint
        unique_id: ac_kamar_setpoint
        availability: "{{ value_json.data.result | count > 0 }}"
        value_template: "{{ value_json.data.result[0].value[1] | int }}"
        unit_of_measurement: "°C"

# ---------------------------------------------------------------------------
# Writing to the room panel.
#
# hub_kamar.py reads lines from a FIFO at /var/lib/roomhub/cmd, bind-mounted
# into this container. No port, no API key, no broker: file permissions are
# the whole access-control story, and the daemon whitelists the four command
# forms it accepts, so a typo lands in the journal instead of going quiet.
#
# The `sh -c` wrapper is required, not decoration. shell_command runs a
# command WITH arguments through exec, not through a shell, so a bare
# `echo X > /path` would pass ">" and the path to echo as text and write
# nothing. Only a command with no arguments at all gets a shell.
# ---------------------------------------------------------------------------
shell_command:
  roomhub_ac_on: 'sh -c "echo ACPOWER=ON > /var/lib/roomhub/cmd"'
  roomhub_ac_off: 'sh -c "echo ACPOWER=OFF > /var/lib/roomhub/cmd"'
  roomhub_ac_temp: 'sh -c "echo ACTEMP={{ suhu | int }} > /var/lib/roomhub/cmd"'
  roomhub_lampu: 'sh -c "echo SEND=0,{{ idx | int }} > /var/lib/roomhub/cmd"'

template:
  - switch:
      - name: AC Kamar
        unique_id: roomhub_ac_switch
        icon: mdi:air-conditioner
        availability: "{{ states('sensor.ac_kamar_power') not in ['unknown', 'unavailable'] }}"
        state: "{{ is_state('sensor.ac_kamar_power', '1') }}"
        turn_on:
          service: shell_command.roomhub_ac_on
        turn_off:
          service: shell_command.roomhub_ac_off

  - number:
      - name: AC Suhu
        unique_id: roomhub_ac_setpoint
        icon: mdi:thermometer
        availability: "{{ states('sensor.ac_kamar_setpoint') not in ['unknown', 'unavailable'] }}"
        state: "{{ states('sensor.ac_kamar_setpoint') | int(25) }}"
        min: 16
        max: 30
        step: 1
        unit_of_measurement: "°C"
        set_value:
          service: shell_command.roomhub_ac_temp
          data:
            suhu: "{{ value }}"

  # Buttons, not switches: the lamp remote sends one toggle code and has no
  # way to report what the lamp is doing. A switch would show a state it
  # cannot know, and would be wrong every time the lamp is used from anywhere
  # else. The index is the position in menuLampu[] in roomhub.ino.
  - button:
      - name: Lampu Meja
        unique_id: roomhub_lampu_toggle
        icon: mdi:lightbulb
        press:
          service: shell_command.roomhub_lampu
          data:
            idx: 0
      - name: Lampu Terang
        unique_id: roomhub_lampu_terang
        icon: mdi:brightness-7
        press:
          service: shell_command.roomhub_lampu
          data:
            idx: 2
      - name: Lampu Redup
        unique_id: roomhub_lampu_redup
        icon: mdi:brightness-4
        press:
          service: shell_command.roomhub_lampu
          data:
            idx: 3