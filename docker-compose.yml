name: homelab

# ------------------------------------------------------------------------------
# Networks
#   proxy      — everything Traefik routes to lives here
#   monitoring — internal-only; Prometheus scrapes targets here
#   authelia   — internal-only; Authelia <-> Redis
# ------------------------------------------------------------------------------
networks:
  proxy:
    name: proxy
  monitoring:
    internal: true
  authelia:
    internal: true

# ------------------------------------------------------------------------------
# Secrets — generated by scripts/bootstrap.sh, never committed
# ------------------------------------------------------------------------------
secrets:
  authelia_jwt_secret:
    file: ./secrets/authelia_jwt_secret
  authelia_session_secret:
    file: ./secrets/authelia_session_secret
  authelia_storage_encryption_key:
    file: ./secrets/authelia_storage_encryption_key
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

volumes:
  authelia_data:
  redis_data:
  prometheus_data:
  grafana_data:
  portainer_data:
  adguard_work:
  adguard_conf:
  ntfy_cache:
  ntfy_data:

services:
  # ==============================================================================
  # Traefik — reverse proxy, TLS termination, Let's Encrypt
  # ==============================================================================
  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    networks:
      - proxy
      - monitoring
    environment:
      - TZ=${TZ}
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme:/acme
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      # Dashboard at https://traefik.${DOMAIN}, protected by Authelia
      traefik.http.routers.traefik.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.middlewares: authelia@file

  # ==============================================================================
  # Authelia — SSO / forward-auth provider (+ Redis session store)
  # ==============================================================================
  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - authelia
      - monitoring
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - authelia_jwt_secret
      - authelia_session_secret
      - authelia_storage_encryption_key
    environment:
      - TZ=${TZ}
      - DOMAIN=${DOMAIN}
      # Enables {{ env "DOMAIN" }} templating inside configuration.yml
      - X_AUTHELIA_CONFIG_FILTERS=template
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/run/secrets/authelia_jwt_secret
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia_session_secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/run/secrets/authelia_storage_encryption_key
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml
      - authelia_data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.authelia.rule: Host(`auth.${DOMAIN}`)
      traefik.http.routers.authelia.entrypoints: websecure
      traefik.http.services.authelia.loadbalancer.server.port: "9091"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - authelia
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # Monitoring — Prometheus, Grafana, node-exporter, cAdvisor
  # ==============================================================================
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.external-url=https://prometheus.${DOMAIN}'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    labels:
      traefik.enable: "true"
      traefik.http.routers.prometheus.rule: Host(`prometheus.${DOMAIN}`)
      traefik.http.routers.prometheus.entrypoints: websecure
      traefik.http.routers.prometheus.middlewares: authelia@file
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - monitoring
    depends_on:
      - prometheus
    secrets:
      - grafana_admin_password
    environment:
      - TZ=${TZ}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.middlewares: authelia@file
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.53.0
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - monitoring
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  # ==============================================================================
  # Optional services — enabled via Compose profiles.
  # Set COMPOSE_PROFILES in .env (e.g. COMPOSE_PROFILES=portainer,homepage)
  # or run: docker compose --profile portainer up -d
  # ==============================================================================

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    profiles:
      - portainer
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: Host(`portainer.${DOMAIN}`)
      traefik.http.routers.portainer.entrypoints: websecure
      traefik.http.routers.portainer.middlewares: authelia@file
      traefik.http.services.portainer.loadbalancer.server.port: "9000"

  # AdGuard Home — DNS ports are published directly on the host; the web UI
  # goes through Traefik. IMPORTANT: during the first-run wizard, set the
  # admin web interface port to 3000 so the Traefik route below keeps working.
  # If the host runs systemd-resolved, free port 53 first (see README).
  adguard:
    image: adguard/adguardhome:latest  # pin a specific version for production
    container_name: adguard
    restart: unless-stopped
    profiles:
      - adguard
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    labels:
      traefik.enable: "true"
      traefik.http.routers.adguard.rule: Host(`adguard.${DOMAIN}`)
      traefik.http.routers.adguard.entrypoints: websecure
      traefik.http.routers.adguard.middlewares: authelia@file
      traefik.http.services.adguard.loadbalancer.server.port: "3000"

  # Ntfy — deliberately NOT behind Authelia: mobile apps subscribe directly
  # and can't follow the SSO redirect. Ntfy's own auth is set to deny-all;
  # create users with: docker compose exec ntfy ntfy user add --role=admin <name>
  ntfy:
    image: binwiederhier/ntfy:v2.11.0  # check for newer releases
    container_name: ntfy
    restart: unless-stopped
    profiles:
      - ntfy
    command: serve
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=https://ntfy.${DOMAIN}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    labels:
      traefik.enable: "true"
      traefik.http.routers.ntfy.rule: Host(`ntfy.${DOMAIN}`)
      traefik.http.routers.ntfy.entrypoints: websecure
      traefik.http.services.ntfy.loadbalancer.server.port: "80"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest  # pin a specific version for production
    container_name: homepage
    restart: unless-stopped
    profiles:
      - homepage
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=home.${DOMAIN}
      - HOMEPAGE_VAR_DOMAIN=${DOMAIN}
    volumes:
      - ./homepage/config:/app/config
      # Read-only socket for the docker status widget
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.homepage.rule: Host(`home.${DOMAIN}`)
      traefik.http.routers.homepage.entrypoints: websecure
      traefik.http.routers.homepage.middlewares: authelia@file
      traefik.http.services.homepage.loadbalancer.server.port: "3000"
